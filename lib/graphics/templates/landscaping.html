<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0D1A0E;
    font-family: 'Oswald', 'Impact', 'Arial Black', sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ── Top service strip ───────────────────────────────────────── */
  .top-bar {
    flex-shrink: 0;
    height: 90px;
    background: #145214;
    display: flex;
    align-items: center;
    padding: 0 56px;
    gap: 18px;
  }
  .top-bar .icon { font-size: 42px; line-height: 1; }
  .top-bar .label {
    color: #FFFFFF;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* ── Main content ────────────────────────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 72px;
    text-align: center;
  }

  .hook {
    color: #FFFFFF;
    font-size: 152px;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -2px;
    text-transform: uppercase;
    white-space: pre-line;
    margin-bottom: 22px;
  }

  .divider {
    width: 96px;
    height: 6px;
    background: #22C55E;
    border-radius: 3px;
    margin-bottom: 26px;
  }

  .value-prop {
    color: #4ADE80;
    font-size: 72px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 44px;
  }

  .cta-badge {
    display: inline-block;
    background: #22C55E;
    color: #0A1A0B;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 17px 56px;
    border-radius: 60px;
    margin-bottom: 44px;
  }

  .locations {
    color: #3D6B44;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  /* ── Bottom brand strip ──────────────────────────────────────── */
  .bottom-bar {
    flex-shrink: 0;
    height: 86px;
    background: #111D12;
    border-top: 4px solid #145214;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .brand-name {
    color: #FFFFFF;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
  }
  .brand-sub {
    color: #4ADE80;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="top-bar">
  <span class="icon">🌿</span>
  <span class="label">Landscaping</span>
</div>

<div class="main">
  <div class="hook" id="hook">OVERGROWN
YARD?</div>
  <div class="divider"></div>
  <div class="value-prop" id="value-prop">GET YOUR WEEKENDS BACK</div>
  <div class="cta-badge" id="cta-text">FREE ESTIMATES</div>
  <div class="locations" id="locations">AUGUSTA • EVANS • GROVETOWN • AIKEN</div>
</div>

<div class="bottom-bar">
  <div class="brand-name">ESEE PROPERTY SERVICES</div>
  <div class="brand-sub">Serving Augusta &amp; the CSRA</div>
</div>

</body>
</html>
